<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Lift flowers out of photos and build a swaying 3D bouquet wrapped in cellophane.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Camera Roll Bouquet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a camera roll on the left (photos you pick flowers out of), a white florist's stage on the right; stacked on phones. Single light look by design: the stage is plain white. */
:root{
  --paper:#ffffff;
  --roll:#f2f1f4;
  --ink:#1e1a21;
  --muted:#7b7482;
  --line:#e3e0e7;
  --plum:#5b2444;
  --plum-soft:#f3e9ef;
  --kraft:#a8784b;
  --display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-columns:minmax(320px,40%) 1fr}

/* ---------- camera roll: a 3D coverflow ring ---------- */
.roll{position:relative;background:var(--roll);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;padding-block:18px 18px;overflow:hidden}
.viewer{position:relative;flex:1;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;perspective:1000px;perspective-origin:50% 45%;cursor:grab}
.viewer.dragging{cursor:grabbing}
.ring{position:absolute;inset:0;transform-style:preserve-3d}
.slide{position:absolute;left:50%;top:50%;border-radius:0;background:#ddd;will-change:transform;overflow:hidden;
  box-shadow:0 1px 2px rgba(30,20,35,.1),0 18px 40px -18px rgba(30,20,35,.45)}
.slide .clip{position:absolute;inset:0;border-radius:8px;overflow:hidden}
.slide .shade{position:absolute;inset:0;background:#2a2230;opacity:var(--shade,0);pointer-events:none}
.slide img.photo{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;transition:filter .35s ease}
.viewer.lifting .slide.current img.photo{filter:brightness(.8) saturate(.82)}
.ghost{position:absolute;pointer-events:none;opacity:0;filter:brightness(0) blur(7px);transition:opacity .3s ease}
.viewer.lifting .ghost.on{opacity:.32}
.hover-glint{position:absolute;pointer-events:none;opacity:0;transition:opacity .2s ease;
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 6px rgba(255,255,255,.6)) brightness(1.06)}
.hover-glint.on{opacity:1}
.dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:0;background:transparent;cursor:grab;padding:0;transition:opacity .3s}
.dot::before,.dot::after{content:"";position:absolute;inset:9px;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);box-shadow:0 0 6px rgba(0,0,0,.25)}
.dot::after{inset:3px;border-color:rgba(255,255,255,.55);animation:breathe 3.2s ease-in-out infinite}
.slide:not(.current) .dot,.viewer.moving .dot{opacity:0;pointer-events:none}
.viewer.lifting .dot{opacity:0}
.dot:focus-visible{outline:2px solid #fff;outline-offset:2px}
@keyframes breathe{0%,100%{transform:scale(.75);opacity:.2}50%{transform:scale(1.15);opacity:.9}}
.thumbs{display:flex;gap:4px;justify-content:center;align-items:center;position:absolute;left:0;right:0;z-index:200;padding:4px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));flex:0 0 auto}
.thumb{width:30px;height:40px;border:0;padding:0;border-radius:4px;overflow:hidden;cursor:pointer;opacity:.55;transition:width .35s ease,height .35s ease,opacity .3s ease;background:#ccc}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.on{width:48px;height:48px;opacity:1;box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.thumb:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

/* ---------- stage ---------- */
.stage{position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl.turning{cursor:grabbing}
.empty{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(300px,70%);aspect-ratio:3/4;border:0;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;
  display:grid;place-items:center;text-align:center;pointer-events:none;transition:opacity .5s ease,transform .5s ease}
.toolbar{position:absolute;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px -14px rgba(40,20,40,.35);max-width:calc(100% - 32px)}
.btn{border:0;border-radius:999px;height:38px;padding:0 16px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;white-space:nowrap}
.btn:hover:not(:disabled){background:#f4f2f5}
.btn:disabled{opacity:.38;cursor:default}
.btn.primary{background:var(--plum);color:#fff;padding:0 20px}
.btn.icon{width:42px;padding:0;display:grid;place-items:center}
.btn.primary.icon{width:58px}
.btn.primary:hover:not(:disabled){background:#4a1c37}
.empty.hide{opacity:0;transform:translate(-50%,-50%) scale(.96)}
.empty.ready{background:radial-gradient(closest-side,rgba(91,36,68,.05),transparent)}
.loading{position:absolute;inset:0;background:var(--paper);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

/* ---------- the lifted flower ---------- */
.lift{position:fixed;left:0;top:0;z-index:50;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 0 1.2px rgba(255,255,255,1)) drop-shadow(0 0 1px rgba(255,255,255,1)) drop-shadow(0 16px 18px rgba(40,20,40,.28)) drop-shadow(0 3px 4px rgba(40,20,40,.18))}
.lift img{width:100%;height:100%;display:block}
.lift .shim{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%) no-repeat;background-size:260% 100%;background-position:120% 0;mix-blend-mode:soft-light;opacity:.95}
.lift .shim.run{animation:sweep 1.05s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes sweep{from{background-position:120% 0}to{background-position:-30% 0}}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,60%) minmax(0,40%)}
  .stage{order:1}
  .roll{order:2;border-right:0;border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
  .toolbar{bottom:14px}
  .thumbs{padding-top:2px}.thumb{height:30px;width:22px}.thumb.on{width:36px;height:36px}
  .btn{height:36px}.btn.icon{width:38px}.btn.primary.icon{width:52px}
}
@media (prefers-reduced-motion:reduce){
  .dot::after{animation:none}
  .lift .shim.run{animation:none}
}
.back-home{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));z-index:300;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:500;text-decoration:none;box-shadow:0 2px 10px rgba(30,20,35,.06);transition:transform .15s ease,background .15s ease}
.back-home:hover{background:#fff;transform:translateY(-1px)}
.gift-tag{position:absolute;left:50%;top:63%;transform:translate(-50%,-50%) scale(.96);z-index:22;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 16px 11px;border-radius:6px;background:#f7efe2;border:1px solid rgba(168,120,75,.42);box-shadow:0 8px 24px -8px rgba(45,25,15,.24);opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease}
.gift-tag.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.gift-tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--paper);border:1.5px solid var(--kraft);flex:0 0 auto}
.gift-tag input{border:0;background:transparent;outline:none;font-family:var(--display);font-style:italic;font-size:18px;color:#3d2a1d;width:min(210px,54vw);text-align:center}
.gift-tag input::placeholder{color:rgba(120,86,58,.55)}
.style-bar{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:21;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 2px 10px rgba(30,20,35,.06);opacity:0;pointer-events:none;transition:opacity .25s ease}
.style-bar.on{opacity:1;pointer-events:auto}
.swatch{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(30,26,33,.22);cursor:pointer;padding:0;transition:transform .15s ease,box-shadow .15s ease}
.swatch.on{transform:scale(1.12);box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink)}
.style-sep{width:1px;height:14px;background:var(--line)}
.wrap-pill{border:0;background:transparent;cursor:pointer;font-size:11.5px;font-weight:500;color:var(--muted);padding:3px 7px;border-radius:999px;transition:background .15s,color .15s}
.wrap-pill.on{background:var(--plum-soft);color:var(--plum)}
.toast{position:absolute;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translate(-50%,-8px);z-index:40;padding:7px 14px;border-radius:999px;background:var(--ink);color:#fff;font-size:12px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;box-shadow:0 4px 16px rgba(30,20,35,.18)}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>

</head>
<body>
<a href="../" id="backHomeBtn" class="back-home" aria-label="Back to portfolio">← Back</a>
<script>
window.addEventListener('pagehide',function(){try{sessionStorage.setItem('skipPreloader','1')}catch(e){}});
document.getElementById('backHomeBtn').addEventListener('click',function(e){
  e.preventDefault();
  try{sessionStorage.setItem('skipPreloader','1')}catch(_){}
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(C){
      var ctx=new C(), len=Math.floor(ctx.sampleRate*0.022), buf=ctx.createBuffer(1,len,ctx.sampleRate), ch=buf.getChannelData(0);
      for(var i=0;i<len;i++) ch[i]=Math.random()*2-1;
      var src=ctx.createBufferSource(); src.buffer=buf;
      var bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1700; bp.Q.value=1.4;
      var g=ctx.createGain(), t=ctx.currentTime;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.32,t+0.001); g.gain.exponentialRampToValueAtTime(0.0001,t+0.021);
      src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t); src.stop(t+0.025);
    }
  }catch(_){}
  setTimeout(function(){
    if(window.parent && window.parent !== window){
      window.parent.postMessage('bouquet:close','*');
    } else {
      location.href='../';
    }
  }, 80);
});
</script>

      <button class="btn primary" id="wrapBtn" aria-label="Wrap the bouquet" disabled style="display:inline-flex;align-items:center;gap:6px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12c-2.5-3.5-7-4-7-1s4.5 2.5 7 1Z"/><path d="M12 12c2.5-3.5 7-4 7-1s-4.5 2.5-7 1Z"/><path d="M12 12l-3.5 8"/><path d="M12 12l3.5 8"/></svg><span>Wrap</span></button>
      <button class="btn icon" id="unwrapBtn" aria-label="Unwrap the bouquet" hidden><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l5 2 4-6 4 6 5-2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 11v10M8.5 17.5 12 21l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="btn icon" id="noteBtn" aria-label="Add a gift note" title="Gift note" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="btn icon" id="shareBtn" aria-label="Copy shareable bouquet link" title="Share link" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
      <button class="btn icon" id="saveBtn" aria-label="Save bouquet postcard" title="Save PNG" hidden><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      <button class="btn icon" id="resetBtn" aria-label="Start over" hidden><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M15.5 2.5v4h-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="loading" id="loading"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ================= subtle tactile sound effects ================= */
let _ac = null;
function ac(){ if(!_ac){ const C=window.AudioContext||window.webkitAudioContext; if(C) _ac=new C(); } if(_ac && _ac.state==='suspended') _ac.resume().catch(()=>{}); return _ac; }
function tone(f0,f1,dur,vol,type='sine'){
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime, o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+dur+0.02);
}
function rustle(dur=0.45,freq=2200,vol=0.055){
  const ctx=ac(); if(!ctx) return;
  const len=Math.floor(ctx.sampleRate*dur), buf=ctx.createBuffer(1,len,ctx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++){ const env=Math.sin(Math.PI*i/len)*(0.4+0.6*Math.abs(Math.sin(i/280))); ch[i]=(Math.random()*2-1)*env; }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=1.1;
  const g=ctx.createGain(); g.gain.value=vol;
  src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start();
}
const sfxLift=()=>{
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime;
  // 1. Crisp organic stem snap (short filtered noise burst)
  const len=Math.floor(ctx.sampleRate*0.045), buf=ctx.createBuffer(1,len,ctx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++){ ch[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.008)); }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(1900,t); bp.frequency.exponentialRampToValueAtTime(950,t+0.04); bp.Q.value=1.6;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
  // 2. Subtle woody stem resonance
  tone(210,125,0.055,0.032,'triangle');
};
const sfxDrop=()=>{ tone(240,115,0.13,0.075,'triangle'); };
const sfxUndo=()=>{ tone(500,260,0.07,0.05,'sine'); };
const sfxRibbon=()=>{
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime;
  // Soft satin/silk swish as ribbon pulls and ties
  const len=Math.floor(ctx.sampleRate*0.18), buf=ctx.createBuffer(1,len,ctx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++){ const env=Math.sin(Math.PI*i/len); ch[i]=(Math.random()*2-1)*env; }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.setValueAtTime(3200,t); bp.frequency.exponentialRampToValueAtTime(1400,t+0.17); bp.Q.value=2.0;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
  tone(520,760,0.09,0.025,'sine');
};
const sfxWrap=()=>{ rustle(0.65,2400,0.06); };
const sfxUnwrap=()=>{ rustle(0.4,1700,0.05); };
const sfxNote=()=>{ rustle(0.14,1900,0.045); tone(460,580,0.06,0.022,'sine'); };
const sfxScribble=()=>{
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime, len=Math.floor(ctx.sampleRate*0.026), buf=ctx.createBuffer(1,len,ctx.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++){ ch[i]=(Math.random()*2-1)*Math.exp(-i/(ctx.sampleRate*0.008)); }
  const src=ctx.createBufferSource(); src.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2800+Math.random()*700; bp.Q.value=2.2;
  const g=ctx.createGain(); g.gain.setValueAtTime(0.022,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.026);
  src.connect(bp); bp.connect(g); g.connect(ctx.destination); src.start(t);
};

function hitFlower(slide, clientX, clientY){
  const r=slide.el.querySelector('img.photo').getBoundingClientRect();
  const nx=(clientX-r.left)/r.width, ny=(clientY-r.top)/r.height;
  if(nx<0||ny<0||nx>1||ny>1) return null;
  let best=null;
  for(const f of slide.defs){
    const px=nx*f.W, py=ny*f.H;
    if(px<f.x||py<f.y||px>f.x+f.w||py>f.y+f.h) continue;
    const a=alpha[f.key]; if(!a) continue;
    const ix=Math.floor((px-f.x)/f.w*a.w), iy=Math.floor((py-f.y)/f.h*a.h);
    const v=a.data[(iy*a.w+ix)*4+3];
    if(v>90 && (!best || f.w*f.h < best.w*best.h)) best=f;   // prefer the smaller (front) flower
  }
  if(best) return best;
  // forgiving fallback for small or lacy flowers (cherry blossom): a press near the flower still picks it
  let bestD=Infinity;
  for(const f of slide.defs){
    const fx=r.left+f.x/f.W*r.width, fy=r.top+f.y/f.H*r.height, fw=f.w/f.W*r.width, fh=f.h/f.H*r.height;
    const pad=Math.max(22, 44-Math.min(fw,fh)*.25);
    if(clientX<fx-pad||clientX>fx+fw+pad||clientY<fy-pad||clientY>fy+fh+pad) continue;
    const d=Math.hypot(clientX-(fx+f.cx*fw), clientY-(fy+f.cy*fh)) / Math.max(1,Math.sqrt(fw*fh));
    if(d<bestD){ bestD=d; best=f; }
  }
  return best;
}
function flowerRect(slide, f){
  const r=slide.el.querySelector('img.photo').getBoundingClientRect();
  return {left:r.left + f.x/f.W*r.width, top:r.top + f.y/f.H*r.height, width:f.w/f.W*r.width, height:f.h/f.H*r.height};
}

}

let lift=null;
const stageEl=$('stage');
function startLift(f, slide, e){
  sfxLift();
  
  const r=flowerRect(slide,f);
  const el=document.createElement('div'); el.className='lift';
  const im=document.createElement('img'); im.src=imgs[f.key].src; im.alt=''; el.appendChild(im);
  const sh=document.createElement('div'); sh.className='shim'; sh.style.webkitMaskImage=sh.style.maskImage=`url(${imgs[f.key].src})`; el.appendChild(sh);
  el.style.width=r.width+'px'; el.style.height=r.height+'px';
  document.body.appendChild(el);
  requestAnimationFrame(()=>sh.classList.add('run'));
  placeOver(slide.ghost, slide, f); slide.ghost.classList.add('on'); viewer.classList.add('lifting');
  lift = {def:f, slide, el, sh, w:r.width, h:r.height, ox:e.clientX-r.left, oy:e.clientY-r.top,
          px:e.clientX, py:e.clientY, tx:e.clientX, ty:e.clientY, vx:0, vy:0, home:{x:e.clientX,y:e.clientY},
          rot:0, rotV:0, s:1, sV:0, sT:1.09, lastX:e.clientX, lastT:performance.now(), pvx:0,
          phase:'held', t0:performance.now(), moved:0, over:false, pointerId:e.pointerId, tw:null};
  render_lift();
  addEventListener('pointermove', onLiftMove); addEventListener('pointerup', onLiftUp); addEventListener('pointercancel', onLiftUp);
}
function onLiftMove(e){
  if(!lift||lift.phase!=='held'||e.pointerId!==lift.pointerId) return;
  lift.moved = Math.max(lift.moved, Math.hypot(e.clientX-lift.home.x, e.clientY-lift.home.y));
  lift.tx=e.clientX; lift.ty=e.clientY;
}
function onLiftUp(e){
  if(!lift||lift.phase!=='held'||e.pointerId!==lift.pointerId) return;
  removeEventListener('pointermove', onLiftMove); removeEventListener('pointerup', onLiftUp); removeEventListener('pointercancel', onLiftUp);
  const quick = lift.moved<7 && performance.now()-lift.t0<450;
  if(e.type!=='pointercancel' && (lift.over || quick)){
    if(state!=='build'){ toast('Unwrap the bouquet to add more stems'); returnLift(); return; }
    if(flowers.length>=24){ toast('That’s a full armful — 24 stems is the limit'); returnLift(); return; }
    let place = lift.over ? placementFromScreen(lift.tx, lift.ty, lift.def) : autoPlacement(lift.def);
    dropLift(place);
  } else returnLift();
}
function render_lift(){
  const L=lift; if(!L) return;
  L.el.style.transformOrigin=`${L.ox}px ${L.oy}px`;
  L.el.style.transform=`translate3d(${L.px-L.ox}px,${L.py-L.oy}px,0) rotate(${L.rot}deg) scale(${L.s})`;
}
function updateLift(dt){
  const L=lift; if(!L) return;

  if(L.phase==='held'){
    // springy follow with lag, pendulum swing around the grab point
    const k=.32, damp=.62;
    L.vx = (L.vx + (L.tx-L.px)*k*f) * Math.pow(damp,f); L.vy = (L.vy + (L.ty-L.py)*k*f) * Math.pow(damp,f);
    L.px+=L.vx*f; L.py+=L.vy*f;
    const sr=stageEl.getBoundingClientRect();
    const over = L.tx>sr.left && L.tx<sr.right && L.ty>sr.top && L.ty<sr.bottom;
    if(over!==L.over){ L.over=over; $('empty').classList.toggle('ready', over); }
    if(over && state==='build'){
      const pl = placementFromScreen(L.tx, L.ty, L.def);
      hoverPoint = pl.H; ringTarget=1;
      const proj = projectPlacement(pl, L.def);
      L.sT = clamp(proj.w / L.w, .35, 1.8);

    for(let i=0;i<P.length;i++){ const tg=_v.copy(P[Math.min(i+1,P.length-1)]).sub(P[Math.max(i-1,0)]).normalize(); const out=V(P[i].x,0,P[i].z).normalize(); const sd=V().crossVectors(tg,out).normalize(); sd.applyAxisAngle(tg,(ci?-1:1)*.25+i*.04); S.push(sd); }
    R.tails[ci].set(P,S,t=>.07*(1-t*.1)); R.tails[ci].mesh.visible=R.bow>.05;
  });
}

/* ================= wrap / unwrap ================= */
let wrapClock=0;
function buildSheets(){
  sheets.forEach(s=>{ bouquet.remove(s.mesh); s.geo.dispose(); }); sheets.length=0;
  computeEnvelope();
  let minY=9,maxY=-9; flowers.forEach(f=>{ minY=Math.min(minY,f.H.y); maxY=Math.max(maxY,f.H.y); });
  const ys=flowers.map(f=>f.H.y).sort((a,b)=>a-b), med=ys[Math.floor(ys.length/2)];
  const backTop = maxY-.35, frontTop = Math.max(.45, Math.min(minY-.05, med-.6));
  const defs=[ {th:Math.PI, span:Math.PI*2*1.04, top:frontTop, peak:backTop+.45-frontTop, off:.02, seed:2.7, delay:0} ];
  for(const d of defs){ const s=new Sheet(d); bouquet.add(s.mesh); sheets.push(s); }
}
function wrap(){
  if(state!=='build'||!flowers.length) return;
  sfxWrap();
  state='wrapping'; wrapClock=0;
  // spin the bouquet's face back to the front
  const twoPi=Math.PI*2; yawGoal = Math.round(yaw/twoPi)*twoPi; pitchGoal=.08; yawVel=0;
  buildSheets(); ribbon.group.visible=false; ribbon.bow=0; ribbon.chains=null;
  refreshUI();
}
function unwrap(){
  if(state!=='wrapped') return; sfxUnwrap(); state='unwrapping'; wrapClock=0; refreshUI();
}
let yawGoal=null, pitchGoal=null;
function updateWrap(dt,time){
  if(state==='wrapping'){
    wrapClock+=dt; const t=wrapClock;
    const g=easeInOut(clamp(t/.6,0,1));
    for(const f of flowers){ f.E.set(lerp(f.E0.x,f.E0.x*.62,g), lerp(f.E0.y,-1.3+(f.E0.y+1.45)*.15,g), lerp(f.E0.z,f.E0.z*.62,g)); f.Tj.lerpVectors(f.Tj0, f.Tj0.clone().multiplyScalar(.45), g); }
    sheets.forEach(s=>{ const p=clamp((t-.3-s.delay)/1.3,0,1); if(p>=1 && s.p<1) s.settle=time; s.p=p; s.update(time); });
    const rt=clamp((t-1.7)/.5,0,1);
    if(t>1.7){ if(!ribbon.group.visible){ ribbon.group.visible=true; sfxRibbon(); } ribbon.rb = lerp(.62, rIn(TIE_Y)+.045, easeOut(rt)); }
    if(t>2.1){ ribbon.bow = easeOutBack(clamp((t-2.1)/.45,0,1)); }
    if(t>2.65){ state='wrapped'; ribbon.bow=1; refreshUI(); for(const f of flowers) f.v.add(V(rnd(.6),.4,rnd(.6))); }
  } else if(state==='unwrapping'){
    wrapClock+=dt; const t=wrapClock;
    ribbon.bow = 1-easeInOut(clamp(t/.3,0,1)); ribbon.rb = lerp(rIn(TIE_Y)+.045,.7,easeInOut(clamp(t/.35,0,1)));
    if(t>.35) ribbon.group.visible=false;
    sheets.forEach((s,i)=>{ s.p = 1-easeInOut(clamp((t-.2-(sheets.length-1-i)*.15)/.75,0,1)); s.update(time); });
    const g=1-easeInOut(clamp((t-.9)/.5,0,1));
    for(const f of flowers){ f.E.set(lerp(f.E0.x,f.E0.x*.62,g), lerp(f.E0.y,-1.3+(f.E0.y+1.45)*.15,g), lerp(f.E0.z,f.E0.z*.62,g)); f.Tj.lerpVectors(f.Tj0,f.Tj0.clone().multiplyScalar(.45),g); }
    if(t>1.45){ sheets.forEach(s=>{ bouquet.remove(s.mesh); s.geo.dispose(); }); sheets.length=0; state='build'; refreshUI(); }
  } else if(state==='wrapped'){
    sheets.forEach(s=>s.update(time));
  }
}

/* ================= ambience: pollen motes, falling petals, drop ring ================= */
const MOTES=46;
const moteGeo=new THREE.BufferGeometry(); const moteP=new Float32Array(MOTES*3); const moteSeed=[];
for(let i=0;i<MOTES;i++){ moteSeed.push({a:Math.random()*6.28, r:.6+Math.random()*1.9, y:-1.5+Math.random()*4.6, s:.04+Math.random()*.1, ph:Math.random()*6}); }
moteGeo.setAttribute('position',new THREE.BufferAttribute(moteP,3));
const motes=new THREE.Points(moteGeo,new THREE.PointsMaterial({size:.045, map:DOT_TEX, color:0xc9a45e, transparent:true, opacity:.55, depthWrite:false, sizeAttenuation:true}));
scene.add(motes);
const bursts=[];
function burst(H){
  const n=14; const g=new THREE.BufferGeometry(); const P=new Float32Array(n*3), vel=[];
  for(let i=0;i<n;i++){ P.set([H.x,H.y,H.z],i*3); vel.push(V(rnd(1),Math.random()*1.2,rnd(1)).multiplyScalar(.9)); }
  g.setAttribute('position',new THREE.BufferAttribute(P,3));
  const pts=new THREE.Points(g,new THREE.PointsMaterial({size:.05,map:DOT_TEX,color:0xe1b86a,transparent:true,opacity:.9,depthWrite:false}));
  bouquet.add(pts); bursts.push({pts,vel,t:0});
}
const petals=[]; let nextPetal=5;
const petalGeo=(()=>{ const s=new THREE.Shape(); s.moveTo(0,0); s.bezierCurveTo(.05,.02,.05,.09,0,.12); s.bezierCurveTo(-.05,.09,-.05,.02,0,0); const g=new THREE.ShapeGeometry(s,8); g.translate(0,-.06,0); return g; })();
function dropPetal(){
  const live=flowers.filter(f=>f.grow>=1 && f.type!=='orchid'); if(!live.length) return;
  const f=live[Math.floor(Math.random()*live.length)];
  const col=(avg[f.def.key]||new THREE.Color(0xffc0cb)).clone();
  const m=new THREE.Mesh(petalGeo,new THREE.MeshLambertMaterial({color:col, emissive:col, emissiveIntensity:.35, side:THREE.DoubleSide, transparent:true}));
  const sz = f.type==='cherry'? .45 : f.type==='lily'? 1.3 : 1;
  m.scale.setScalar(sz); m.castShadow=true;
  const p=f.headGroup.position.clone().add(V(rnd(.15),rnd(.1),rnd(.15))); m.position.copy(p); bouquet.add(m);
  petals.push({m, v:V(rnd(.1),-.05,rnd(.1)), spin:V(rnd(2),rnd(2),rnd(2)), t:0, ph:Math.random()*6});
}
const ring=new THREE.Mesh(new THREE.RingGeometry(.15,.165,48), new THREE.MeshBasicMaterial({color:0x5b2444, transparent:true, opacity:0, depthWrite:false, depthTest:false}));
const ringInner=new THREE.Mesh(new THREE.CircleGeometry(.15,48), new THREE.MeshBasicMaterial({color:0x5b2444, transparent:true, opacity:0, depthWrite:false, depthTest:false}));
ring.renderOrder=ringInner.renderOrder=10; bouquet.add(ring, ringInner); let ringA=0;

/* ================= turning the bouquet ================= */
let turning=null;
canvas.addEventListener('pointerdown',e=>{ if(lift) return; turning={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId}; canvas.setPointerCapture(e.pointerId); canvas.classList.add('turning'); yawGoal=null; pitchGoal=null; });
canvas.addEventListener('pointermove',e=>{ if(!turning||e.pointerId!==turning.id) return; const dx=e.clientX-turning.x, dy=e.clientY-turning.y; const now=performance.now(), dt=Math.max(now-turning.t,1)/1000;
  yaw += dx*.0095; pitch = clamp(pitch+dy*.005,-.45,.6); yawVel = lerp(yawVel, dx*.0095/dt, .5); turning.x=e.clientX; turning.y=e.clientY; turning.t=now; });
const endTurn=e=>{ if(!turning||e.pointerId!==turning.id) return; if(performance.now()-turning.t>90) yawVel=0; turning=null; canvas.classList.remove('turning'); };
canvas.addEventListener('pointerup',endTurn); canvas.addEventListener('pointercancel',endTurn);
canvas.tabIndex=0;
canvas.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft'){ yawVel-=2.2; e.preventDefault(); } if(e.key==='ArrowRight'){ yawVel+=2.2; e.preventDefault(); } if(e.key==='ArrowUp'){ pitch=clamp(pitch-.08,-.45,.6); } if(e.key==='ArrowDown'){ pitch=clamp(pitch+.08,-.45,.6); } });

/* ================= UI ================= */
let ribbonIdx=0;
let noteOpen=false;
function refreshUI(){
  const n=flowers.length;
  $('empty').classList.toggle('hide', n>0);
  const wrapped = state==='wrapped'||state==='wrapping';
  $('undoBtn').hidden = wrapped || state==='unwrapping'; $('wrapBtn').hidden = wrapped || state==='unwrapping';
  $('undoBtn').disabled = !n || state!=='build'; $('wrapBtn').disabled = !n || state!=='build';
  $('unwrapBtn').hidden = !wrapped; $('resetBtn').hidden = !wrapped;
  $('noteBtn').hidden = !wrapped; $('shareBtn').hidden = !wrapped; $('saveBtn').hidden = !wrapped;
  $('unwrapBtn').disabled = state!=='wrapped'; $('resetBtn').disabled = state!=='wrapped';
  $('noteBtn').disabled = state!=='wrapped'; $('shareBtn').disabled = state!=='wrapped'; $('saveBtn').disabled = state!=='wrapped';
  $('giftTag').classList.toggle('on', state==='wrapped' && (noteOpen || $('giftNote').value.trim().length>0));
  $('styleBar').classList.toggle('on', state==='wrapped');
}
function setRibbon(idx){
  ribbonIdx=idx;
  ribbonMat.color.setHex(RIBBONS[idx].col);
  ribbonMat.roughness = idx===1 ? 0.78 : idx===2 ? 0.25 : 0.34;
  document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('on', Number(b.dataset.ribbon)===idx));
}
function setWrapStyle(mode){
  wrapMode=mode;
  const mat = mode==='kraft' ? kraftMat : paperMat;
  sheets.forEach(s=>{ s.mesh.material=mat; });
  document.querySelectorAll('.wrap-pill').forEach(b=>b.classList.toggle('on', b.dataset.wrap===mode));
}
document.querySelectorAll('.swatch').forEach(b=>b.addEventListener('click',()=>{ sfxRibbon(); setRibbon(Number(b.dataset.ribbon)); }));
document.querySelectorAll('.wrap-pill').forEach(b=>b.addEventListener('click',()=>{ sfxClick(); setWrapStyle(b.dataset.wrap); }));
$('wrapBtn').onclick=wrap; $('unwrapBtn').onclick=unwrap;
$('undoBtn').onclick=()=>{ const f=[...flowers].reverse().find(f=>f.out===0); if(!f||state!=='build') return; sfxUndo(); f.out=.0001; };
$('giftNote').addEventListener('input', ()=>{ sfxScribble(); });
$('noteBtn').onclick=()=>{ sfxNote(); noteOpen=!noteOpen; refreshUI(); if(noteOpen) setTimeout(()=>$('giftNote').focus(),60); };
const B36 = '0123456789abcdefghijklmnopqrstuvwxyz';
const keyToIdx = Object.fromEntries(FL.map((f,i)=>[f.key,i]));
$('shareBtn').onclick=async()=>{
  sfxClick();
  const code=flowers.filter(f=>!f.out).map(f=>B36[keyToIdx[f.def.key]]||'').join('');
  const u=new URL(location.href);
  u.search='';
  if(code) u.searchParams.set('b',code);
  const note=$('giftNote').value.trim();
  if(note) u.searchParams.set('n',note);
  if(ribbonIdx) u.searchParams.set('r',String(ribbonIdx));
  if(wrapMode!=='cellophane') u.searchParams.set('w','k');
  try{ history.replaceState(null,'',u.toString()); }catch(_){}
  try{ await navigator.clipboard.writeText(u.toString()); toast('Bouquet link copied!'); }
  catch(_){ prompt('Copy your bouquet link:', u.toString()); }
};
$('saveBtn').onclick=()=>{
  sfxClick();
  renderer.render(scene,camera);
  const pad=48, note=$('giftNote').value.trim(), foot=note?88:44;
  const out=document.createElement('canvas');
  out.width=canvas.width+pad*2; out.height=canvas.height+pad+foot;
  const g=out.getContext('2d');
  g.fillStyle='#ffffff'; g.fillRect(0,0,out.width,out.height);
  g.drawImage(canvas,pad,pad);
  g.strokeStyle='#e3e0e7'; g.lineWidth=2; g.strokeRect(1,1,out.width-2,out.height-2);
  if(note){
    g.fillStyle='#3d2a1d'; g.font='italic 32px "Instrument Serif", Georgia, serif';
    g.textAlign='center'; g.fillText('“'+note+'”', out.width/2, out.height-34);
  }
  const a=document.createElement('a'); a.download='bouquet.png'; a.href=out.toDataURL('image/png'); a.click();
  toast('Postcard saved!');
};
$('resetBtn').onclick=()=>{ if(state!=='wrapped') return; sfxUnwrap(); noteOpen=false; $('giftNote').value=''; setWrapStyle('cellophane'); setRibbon(0); state='unwrapping'; wrapClock=0;
  const fin=()=>{ if(state!=='build'){ requestAnimationFrame(fin); return; } flowers.forEach(f=>{ if(!f.out) f.out=.0001; }); };
  fin(); refreshUI(); };
function quickAdd(def, from){
  if(!ready) return;
  if(state!=='build'){ toast('Unwrap the bouquet to add more stems'); return; }
  const s=slides[cur]; const r=flowerRect(s,def);
  lift={def, slide:s, el:null}; // placeholder to reuse helpers
  const el=document.createElement('div'); el.className='lift'; const im=document.createElement('img'); im.src=imgs[def.key].src; im.alt=''; el.appendChild(im);
  el.style.width=r.width+'px'; el.style.height=r.height+'px'; document.body.appendChild(el);
  Object.assign(lift,{el, w:r.width, h:r.height, ox:r.width/2, oy:r.height/2, px:r.left+r.width/2, py:r.top+r.height/2, rot:0, s:1, phase:'drop', tw:null});
  placeOver(s.ghost,s,def); s.ghost.classList.add('on'); viewer.classList.add('lifting'); 
  dropLift(autoPlacement(def));
}

/* ================= main loop ================= */
let clock=0, last=performance.now(), ready=false;
function loop(now){
  const dt=Math.min((now-last)/1000, 1/30); last=now; clock+=dt;
  // carousel spring
  renderRoll(dt);
  updateLift(dt);
  // bouquet rotation: inertia, idle breathing, auto-face for wrapping
  if(!turning){
    if(yawGoal!=null){ yawVel = lerp(yawVel,(yawGoal-yaw)*4,.15); if(Math.abs(yawGoal-yaw)<.002){ yaw=yawGoal; yawGoal=null; yawVel=0; } }
    else yawVel *= Math.exp(-2.2*dt);
    yaw += yawVel*dt;
    const pg = pitchGoal ?? .06; pitch = lerp(pitch, pg, 1-Math.exp(-.8*dt));
  }
  const idle = Math.sin(clock*.23)*.035;
  bouquet.rotation.y = yaw + idle; tilt.rotation.x = pitch;
  bouquet.position.y = Math.sin(clock*.8)*.012;
  // angular velocity / acceleration in the bouquet's frame
  const yr=(bouquet.rotation.y-prevYaw)/dt, pr=(pitch-prevPitch)/dt; prevYaw=bouquet.rotation.y; prevPitch=pitch;
  const by=bouquet.rotation.y;
  const om=V(pr*Math.cos(by), yr, pr*Math.sin(by));
  omega.lerp(om,.5); alphaA.lerp(_v.copy(omega).sub(omegaPrev).divideScalar(dt),.3); omegaPrev.copy(omega);
  if(alphaA.length()>60) alphaA.setLength(60);
  // gusts of breeze
  if(clock>nextGust){ gustTarget = .5+Math.random()*.6; nextGust = clock + 7+Math.random()*8; setTimeout(()=>gustTarget=0, 1200+Math.random()*900); }
  gust = lerp(gust,gustTarget,1-Math.exp(-1.6*dt));
  // flowers
  for(let i=flowers.length-1;i>=0;i--){ const f=flowers[i];
    if(f.out>0){ f.out=Math.min(1,f.out+dt*2.2); if(f.out>=1){ disposeFlower(f); flowers.splice(i,1); updateDome(); refreshUI(); continue; } }
    // sub-stepped springs keep stiff stems stable
    for(let s=0;s<2;s++) stepPhysics(f,dt/2,clock);
    updateFlower(f,dt);
  }
  paperU.uTime.value=clock; updateWrap(dt,clock);
  if(ribbon.group.visible) updateRibbon(dt,clock);
  // motes
  for(let i=0;i<MOTES;i++){ const m=moteSeed[i]; m.y += m.s*dt*(1+gust*2); m.a += dt*(.05+gust*.3)/m.r; if(m.y>3.4) m.y=-1.6;
    moteP[i*3]=Math.sin(m.a)*m.r + Math.sin(clock*.5+m.ph)*.08; moteP[i*3+1]=m.y; moteP[i*3+2]=Math.cos(m.a)*m.r; }
  moteGeo.attributes.position.needsUpdate=true; motes.material.opacity = .35+.2*Math.sin(clock*.7);
  for(let i=bursts.length-1;i>=0;i--){ const b=bursts[i]; b.t+=dt; const P=b.pts.geometry.attributes.position;
    for(let j=0;j<b.vel.length;j++){ b.vel[j].y-=dt*.8; b.vel[j].multiplyScalar(.97); P.array[j*3]+=b.vel[j].x*dt; P.array[j*3+1]+=b.vel[j].y*dt; P.array[j*3+2]+=b.vel[j].z*dt; }
    P.needsUpdate=true; b.pts.material.opacity=Math.max(0,.9*(1-b.t/1.4)); if(b.t>1.4){ bouquet.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i,1); } }
  // petals
  if(clock>nextPetal && !reduceMotion){ nextPetal=clock+9+Math.random()*10; dropPetal(); }
  for(let i=petals.length-1;i>=0;i--){ const p=petals[i]; p.t+=dt; p.v.y=Math.max(p.v.y-dt*.25,-.32); p.m.position.x+= (p.v.x+Math.sin(p.t*2.2+p.ph)*.18)*dt; p.m.position.y+=p.v.y*dt; p.m.position.z+=(p.v.z+Math.cos(p.t*1.7+p.ph)*.12)*dt;
    p.m.rotation.x+=p.spin.x*dt; p.m.rotation.y+=p.spin.y*dt; p.m.rotation.z+=p.spin.z*dt*.5;
    p.m.material.opacity = clamp((p.m.position.y+2.3)/.6,0,1)*clamp(p.t*3,0,1);
    if(p.m.position.y<-2.4){ bouquet.remove(p.m); p.m.material.dispose(); petals.splice(i,1); } }
  // drop target ring
  ringA = lerp(ringA, ringTarget, 1-Math.exp(-10*dt));
  if(hoverPoint){ ring.position.copy(hoverPoint); ringInner.position.copy(hoverPoint); }
  ring.quaternion.copy(bouquet.quaternion).premultiply(tilt.quaternion).invert().multiply(camera.quaternion); ringInner.quaternion.copy(ring.quaternion);
  const pulse=1+.12*Math.sin(clock*5); ring.scale.setScalar(pulse); ringInner.scale.setScalar(pulse*.92);
  ring.material.opacity=ringA*.6; ringInner.material.opacity=ringA*.07; ring.visible=ringInner.visible=ringA>.01;
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* ================= boot ================= */
go(0);
Promise.all(FL.map(async f=>{
  const im=await loadImg(`cuts/${f.key}.webp`); imgs[f.key]=im;
  const [c,g]=cnv(im.naturalWidth,im.naturalHeight); g.drawImage(im,0,0); const d=g.getImageData(0,0,c.width,c.height);
  alpha[f.key]={w:c.width,h:c.height,data:d.data};
  let r=0,gg=0,b=0,n=0; for(let i=0;i<d.data.length;i+=16){ if(d.data[i+3]>200){ r+=d.data[i]; gg+=d.data[i+1]; b+=d.data[i+2]; n++; } }
  avg[f.key]=new THREE.Color().setRGB(r/n/255,gg/n/255,b/n/255).convertSRGBToLinear();
})).then(()=>{
  ready=true; $('loading').classList.add('done');
  const sp=new URLSearchParams(location.search);
  const bParam=sp.get('b'), fParam=sp.get('f'), nParam=sp.get('n'), rParam=sp.get('r'), wParam=sp.get('w');
  if(rParam && RIBBONS[Number(rParam)]) setRibbon(Number(rParam));
  if(wParam==='k' || wParam==='kraft') setWrapStyle('kraft');
  else if(wParam==='cellophane') setWrapStyle('cellophane');
  if(nParam){ $('giftNote').value=nParam.slice(0,30); noteOpen=true; }
  const restoreKeys = bParam
    ? bParam.split('').map(c=>FL[B36.indexOf(c)]?.key).filter(Boolean).slice(0,18)
    : (fParam ? fParam.split(',').filter(k=>byKey[k]).slice(0,18) : []);
  if(restoreKeys.length){
    restoreKeys.forEach((k,idx)=>setTimeout(()=>{
      const p=autoPlacement(byKey[k]); addFlower(byKey[k], p);
      if(idx===restoreKeys.length-1) setTimeout(()=>wrap(), 350);
    }, idx*90));
  }
}).catch(()=>{ $('loading').textContent='Some flowers didn’t load. Reload the page to try again.'; });
resize(); refreshUI();
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(loop); });
})();
